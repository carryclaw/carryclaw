      <rect x="982" y="205" width="60" height="9" rx="4" fill="#71816D" />

      <path d="M1084 232 C1068 202 1071 174 1087 154 M1085 191 C1065 184 1055 170 1053 153 M1086 179 C1104 167 1112 150 1110 132" fill="none" stroke="#6D8064" stroke-width="7" stroke-linecap="round" />
      <ellipse cx="1054" cy="150" rx="15" ry="8" fill="#7D916F" transform="rotate(34 1054 150)" />
      <ellipse cx="1110" cy="131" rx="16" ry="9" fill="#738768" transform="rotate(-38 1110 131)" />
