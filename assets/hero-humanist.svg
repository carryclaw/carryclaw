      <path d="M709 246 C694 276 692 302 697 330 M760 247 C772 276 786 299 806 324" fill="none" stroke="#4C4B42" stroke-width="14" stroke-linecap="round" />
      <path d="M683 220 C661 248 660 289 672 319" fill="none" stroke="#6F7568" stroke-width="12" stroke-linecap="round" />

      <path d="M824 247 L841 190 H930 L946 247 Z" fill="#E7DDCD" stroke="#665D52" stroke-width="4" />
      <rect x="849" y="200" width="72" height="41" rx="3" fill="#7C8B83" opacity="0.88" />
