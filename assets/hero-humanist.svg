    <path d="M0 334 C191 309 355 319 522 345 L0 360 Z" fill="#C56F4F" opacity="0.72" filter="url(#brush)" />

    <circle cx="154" cy="100" r="51" fill="#D88455" opacity="0.92" filter="url(#soft)" />
    <path d="M75 172 C199 122 340 126 470 162" fill="none" stroke="#D3A34B" stroke-width="20" stroke-linecap="round" opacity="0.54" filter="url(#brush)" />
    <path d="M102 207 C243 168 368 178 507 213" fill="none" stroke="#B76A50" stroke-width="9" stroke-linecap="round" opacity="0.48" filter="url(#brush)" />

    <g opacity="0.96">
