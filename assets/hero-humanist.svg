      <path d="M653 271 L640 344 M1094 271 L1110 344" stroke="#62483A" stroke-width="10" stroke-linecap="round" />

      <ellipse cx="735" cy="171" rx="23" ry="26" fill="#C98F6C" />
      <path d="M713 168 C714 140 753 137 760 162 C748 151 727 153 713 168 Z" fill="#4A4037" />
      <path d="M713 202 C742 184 782 200 793 245 L703 248 C701 226 701 211 713 202 Z" fill="#B85F43" filter="url(#brush)" />
