    <path d="M519 86 C607 52 700 56 775 83" fill="none" stroke="#8C9B8A" stroke-width="7" stroke-linecap="round" opacity="0.42" filter="url(#brush)" />
    <path d="M523 106 C599 82 674 85 742 109" fill="none" stroke="#C98768" stroke-width="4" stroke-linecap="round" opacity="0.48" />
