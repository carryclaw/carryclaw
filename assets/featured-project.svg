<svg xmlns="http://www.w3.org/2000/svg" width="820" height="190" viewBox="0 0 820 190" role="img" aria-labelledby="title description">
  <title id="title">codex-permission-popup</title>
  <desc id="description">A native macOS permission dialog for Codex</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1117" />
      <stop offset="0.56" stop-color="#111B2E" />
      <stop offset="1" stop-color="#1B1338" />
    </linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F6FEB" />
      <stop offset="1" stop-color="#7C3AED" />
    </linearGradient>
    <style>
      .text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
      .title { fill: #F0F6FC; font-size: 26px; font-weight: 700; }
      .description { fill: #B7C4D6; font-size: 16px; }
      .tag { fill: #DCE8FA; font-size: 13px; font-weight: 600; }
      .meta { fill: #8B9DB5; font-size: 13px; }
    </style>
  </defs>

  <rect x="1" y="1" width="818" height="188" rx="18" fill="url(#background)" stroke="url(#border)" stroke-width="2" />
  <circle cx="42" cy="42" r="13" fill="#1F6FEB" opacity="0.22" />
  <path d="M36 42h12M42 36v12" stroke="#58A6FF" stroke-width="2.4" stroke-linecap="round" />

  <text x="66" y="50" class="text title">codex-permission-popup</text>
  <text x="40" y="84" class="text description">Centered native macOS permission dialog for Codex.</text>
  <text x="40" y="109" class="text description">让授权请求更显眼、更可控；默认保守，绝不自动批准。</text>

  <g transform="translate(40 137)">
    <rect width="88" height="28" rx="14" fill="#1F6FEB" opacity="0.2" />
    <text x="44" y="19" text-anchor="middle" class="text tag">JavaScript</text>
  </g>
  <g transform="translate(140 137)">
    <rect width="72" height="28" rx="14" fill="#7C3AED" opacity="0.22" />
    <text x="36" y="19" text-anchor="middle" class="text tag">macOS</text>
  </g>
  <g transform="translate(224 137)">
    <rect width="112" height="28" rx="14" fill="#238636" opacity="0.22" />
    <text x="56" y="19" text-anchor="middle" class="text tag">Codex Hooks</text>
  </g>

  <text x="770" y="50" text-anchor="end" class="text meta">PUBLIC PROJECT</text>
  <text x="770" y="158" text-anchor="end" class="text meta">View repository</text>
</svg>
